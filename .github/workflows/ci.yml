name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Node 24 LTS, matching local development. Angular 22 will require
          # ^22.22.3 || ^24.15.0 || >=26.0.0, so 20 has to go before that lands.
          # Not 26: it enables Web Storage by default and leaves localStorage
          # undefined unless --localstorage-file is passed, which shadows the
          # jsdom global and breaks the unit tests.
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Angular
        run: npx ng build

      - name: Test frontend
        run: npx ng test
        env:
          CI: true

      - name: Check Rust
        working-directory: src-tauri
        run: cargo check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test

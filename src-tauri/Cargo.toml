[package]
name = "scim-inspector"
version = "0.2.2"
description = "SCIM 2.0 Server Validator and Load Tester"
authors = ["SCIM Inspector"]
edition = "2021"

[lib]
name = "scim_inspector_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "scim-inspector"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.23"
rand = "0.10"
thiserror = "2"
csv = "1.4"
regex-lite = "0.1"
tauri-plugin-opener = "2"
rust_xlsxwriter = "0.97.1"
# Held at 3.x deliberately. keyring 4 is a ground-up rewrite (keyring-core plus
# per-platform store crates) and it is not verified that credentials written by
# 3.x remain readable, which would silently orphan users' saved SCIM tokens.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
